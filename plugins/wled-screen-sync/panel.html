<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ambilight tuning</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101719;color:#edf3f1}
*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:clamp(16px,4vw,40px)}
h1{font-size:clamp(28px,4vw,42px);margin:0 0 .2em;letter-spacing:-.035em}h2{font-size:1.2rem;margin:0 0 6px}
#status{margin:0 0 20px;color:#a8c9bf;line-height:1.6}section{background:#182225;border:1px solid #334443;border-radius:14px;padding:18px 22px;margin:12px 0}
.row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(170px,1fr);gap:8px 24px;align-items:center;padding:13px 0}.row+.row{border-top:1px solid #32403f}
label{font-weight:600}small{display:block;color:#b4c2bf;line-height:1.45;margin-top:4px}.inputs{display:flex;align-items:center;gap:8px}
input[type=range]{min-width:50px;width:100%;accent-color:#82dcc1}input[type=number]{width:5em}
input[type=number],select,button{background:#10191b;color:inherit;border:1px solid #536761;border-radius:7px;padding:8px;font:inherit}
select{width:100%}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.capture{margin-bottom:16px}#captureMsg{color:#b4c2bf}.unit{font-size:12px;color:#bccbc7;white-space:nowrap}
footer{position:sticky;bottom:0;background:#101719f5;padding:12px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
button{cursor:pointer}button.primary{background:#94e1c4;color:#142921;border-color:transparent;font-weight:650}button:disabled{opacity:.5;cursor:default}#msg{font-size:.92em;color:#c1d2cd}
@media(max-width:570px){.row{grid-template-columns:1fr}section{padding:15px}footer{gap:6px}}
</style>
<main><h1>Ambilight tuning</h1><p id="status">Reading capture status…</p>
<section class="capture"><h2>Capture</h2><div class="actions"><button type="button" data-action="start">Start</button><button type="button" data-action="stop">Stop</button><button type="button" data-action="restart">Restart</button><span id="captureMsg" role="status"></span></div><small>Restart restores full-picture capture, matches 538 zones to WLED, targets 60 FPS, and delays fallback for 8 seconds.</small></section>
<form id="form"><div id="groups"></div>
<footer><button type="button" class="primary" id="apply" disabled>Apply settings</button><button type="button" id="defaults" disabled>Restore defaults</button><span role="status" id="msg"></span></footer></form></main>
<script>
'use strict';
var fields=[], saved={}, inputs={}, pending=false;
var el=function(id){return document.getElementById(id)};
function request(url,opts){return fetch(url,opts).then(function(r){return r.json().then(function(d){if(!r.ok)throw Error(d.error||'Request failed');return d;});});}
function node(tag,parent,txt){var n=document.createElement(tag);parent.appendChild(n);if(txt!==undefined)n.textContent=txt;return n;}
function values(){var d={};fields.forEach(function(f){d[f.key]=f.options||f.type==='ipv4'?inputs[f.key].main.value:Number(inputs[f.key].main.value);});return d;}
function change(){var v=values();var dirty=fields.some(function(f){return saved[f.key]!==v[f.key];});el('apply').disabled=!dirty||pending;el('msg').textContent=dirty?'Unsaved changes':'';}
function fill(d){fields.forEach(function(f){var i=inputs[f.key];i.main.value=d[f.key];if(i.range)i.range.value=d[f.key];});change();}
function draw(data){
 fields=data.fields.filter(function(f){return !f.hidden;});saved=data.values;var sections={};
 fields.forEach(function(f){
  var section=sections[f.group];if(!section){section=node('section',el('groups'));sections[f.group]=section;node('h2',section,f.group);}
  var row=node('div',section);row.className='row';var left=node('div',row),label=node('label',left,f.label);label.htmlFor=f.key;
  if(f.hint)node('small',left,f.hint);var right=node('div',row);right.className='inputs';var i={};inputs[f.key]=i;
  if(f.type==='ipv4'){i.main=node('input',right);i.main.type='text';i.main.inputMode='decimal';i.main.autocomplete='off';i.main.pattern='(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(?:\\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}';i.main.required=true;}
  else if(f.options||f.choices){i.main=node('select',right);(f.choices||Object.keys(f.options)).forEach(function(k){var o=node('option',i.main,f.options?f.options[k]:k);o.value=k;});}
  else{i.range=node('input',right);i.range.type='range';i.range.setAttribute('aria-label',f.label);i.main=node('input',right);i.main.type='number';i.main.required=true;
   [i.range,i.main].forEach(function(n){n.min=f.min;n.max=f.max;n.step=1;});i.range.oninput=function(){i.main.value=i.range.value;change();};
   node('span',right,f.unit).className='unit';
   if(f.key==='Wled'){var check=node('button',right,'Check WLED');check.type='button';check.onclick=function(){check.disabled=true;request('wled-probe',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({address:i.main.value})}).then(function(d){el('msg').textContent=d.name+' · '+(d.leds||'?')+' LEDs · '+d.address;}).catch(function(e){el('msg').textContent=e.message;}).then(function(){check.disabled=false;});};}}
  i.main.id=f.key;i.main.oninput=i.main.onchange=function(){if(i.range)i.range.value=i.main.value;change();};
 });fill(saved);el('defaults').disabled=false;
}
el('defaults').onclick=function(){var d={};fields.forEach(function(f){d[f.key]=f.default;});fill(d);};
el('apply').onclick=function(){if(pending||!el('form').reportValidity())return;var v=values(),patch={};fields.forEach(function(f){if(v[f.key]!==saved[f.key])patch[f.key]=v[f.key];});
 pending=true;el('apply').disabled=true;el('groups').style.pointerEvents='none';el('defaults').disabled=true;
 request('settings',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(patch)}).then(function(d){pending=false;saved=d.values;fill(saved);el('msg').textContent='Settings saved';}).catch(function(e){pending=false;change();el('msg').textContent=e.message;}).then(function(){el('groups').style.pointerEvents='';el('defaults').disabled=false;});};
document.querySelectorAll('[data-action]').forEach(function(button){button.onclick=function(){
 var action=button.dataset.action;document.querySelectorAll('[data-action]').forEach(function(b){b.disabled=true;});
 el('captureMsg').textContent=action==='stop'?'Stopping…':action==='start'?'Starting…':'Restarting…';
 request('capture-action',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:action})})
 .then(function(result){
  if(action==='restart')return request('settings').then(function(d){saved=d.values;fill(saved);el('captureMsg').textContent='Restarting · Auto picture attempt for '+Math.round(result.pictureRecoveryMs/1000)+' seconds';});
  el('captureMsg').textContent=action==='stop'?'Capture stopped':'Capture starting';
 }).then(function(){setTimeout(live,1200);})
 .catch(function(e){el('captureMsg').textContent=e.message;})
 .then(function(){setTimeout(function(){document.querySelectorAll('[data-action]').forEach(function(b){b.disabled=false;});},1200);});
};});
function live(){request('live').then(function(d){var s=d.stdout||'',z=s.match(/(\d+) regions/),fps=s.match(/capture ([\d.]+)\/s/);
 el('status').textContent=s.indexOf('Capture stopped')>=0?'Capture stopped':z&&fps?z[1]+' zones · '+fps[1]+' scans/s · '+(s.indexOf('TV sampled RGB')>=0?'TV color sampler':s.indexOf('HDR10 PQ')>=0?'HDR10 video':'SDR video'):'Waiting for capture…';}).catch(function(){el('status').textContent='Capture status unavailable';});}
request('settings').then(draw).catch(function(e){el('msg').textContent=e.message;});live();setInterval(live,5000);
</script></html>
